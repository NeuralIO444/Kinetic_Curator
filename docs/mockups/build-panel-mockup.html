<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Build Panel Mockup</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0c0f;
      --panel: #101216;
      --cell: #0a0c0f;
      --cell-hi: #d9dde2;
      --line: #1e2126;
      --line-hi: #343941;
      --text: #c8cdd3;
      --quiet: #737b86;
      --faint: #4d535d;
      --amber: #f0a832;
      --amber-low: #382810;
      --red: #e5484d;
      --shadow: rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #08090b;
        --panel: #0c0e11;
        --cell: #080a0c;
        --cell-hi: #d5d9de;
        --line: #1e2126;
        --line-hi: #343941;
        --text: #c8cdd3;
        --quiet: #6d7580;
        --faint: #444a53;
        --amber: #f0a832;
        --amber-low: #30220d;
        --red: #e5484d;
        --shadow: rgba(0,0,0,.58);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .instrument {
      width: min(100%, 790px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--panel);
      border-inline: 1px solid var(--line);
      box-shadow: 0 18px 70px var(--shadow);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 12px;
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      backdrop-filter: blur(9px);
      border-bottom: 1px solid var(--line);
    }
    .build-mark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: .15em;
    }
    .build-mark::before {
      content: "P03";
      padding: 4px 6px;
      color: #08090b;
      background: var(--cell-hi);
      font-size: 8px;
      letter-spacing: .08em;
    }
    .top-note {
      margin-left: auto;
      color: var(--faint);
      font-size: 8px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .roll {
      min-width: 82px;
      height: 31px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      cursor: pointer;
      letter-spacing: .08em;
    }
    .roll:hover, .roll:focus-visible { background: var(--red); color: #08090b; outline: none; }
    .roll.shake { animation: dice-shake 320ms steps(2, end); }
    @keyframes dice-shake {
      0%,100% { transform: translate(0,0) rotate(0); }
      25% { transform: translate(-2px,1px) rotate(-2deg); }
      50% { transform: translate(2px,-1px) rotate(2deg); }
      75% { transform: translate(-1px,-1px) rotate(1deg); }
    }

    .panel-body { padding: 0 12px 24px; transition: padding-right .18s ease; }
    .instrument.editor-open .panel-body { padding-right: 264px; }
    .section {
      padding: 13px 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-child { border-bottom: 0; }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
    }
    .section-no {
      display: grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border: 1px solid var(--line-hi);
      color: var(--quiet);
      font-size: 9px;
      letter-spacing: 0;
    }
    .section-caption {
      margin-left: auto;
      color: var(--faint);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: .11em;
    }
    .micro-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 9px 0 5px;
      color: var(--quiet);
      font-size: 8px;
      line-height: 1;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .micro-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .button-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(68px, 1fr));
      gap: 3px;
    }
    .matrix-button {
      min-width: 0;
      min-height: 30px;
      padding: 5px 6px;
      border: 1px solid var(--line);
      background: var(--cell);
      color: var(--quiet);
      cursor: pointer;
      overflow: hidden;
      font-size: 8px;
      line-height: 1.12;
      letter-spacing: .05em;
      text-align: center;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .matrix-button:hover { border-color: var(--line-hi); color: var(--text); }
    .matrix-button:focus-visible { outline: 1px solid var(--text); outline-offset: 1px; }
    .matrix-button.selected {
      border-color: var(--cell-hi);
      background: var(--cell-hi);
      color: #08090b;
    }
    .matrix-button.primary.selected { border-color: var(--red); background: var(--red); }
    .value-matrix { margin-top: 4px; }
    .value-button {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px;
      color: var(--amber);
      border-color: color-mix(in srgb, var(--amber) 35%, var(--line));
      text-align: left;
    }
    .value-button .value {
      color: var(--amber);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .value-button:hover, .value-button:focus-visible { border-color: var(--amber); color: var(--amber); outline-color: var(--amber); }

    .palette-button {
      position: relative;
      min-height: 45px;
      padding-top: 24px;
      text-align: left;
    }
    .palette-button::before {
      content: "";
      position: absolute;
      inset: 5px 5px auto;
      height: 13px;
      background: var(--swatches);
    }
    .grown { --swatches: linear-gradient(90deg,#293d2e 0 25%,#81894d 25% 50%,#c9854a 50% 75%,#e1c59d 75%); }
    .vortex { --swatches: linear-gradient(90deg,#172952 0 25%,#2d7791 25% 50%,#ce5b4b 50% 75%,#e4c24a 75%); }
    .sepia { --swatches: linear-gradient(90deg,#251e1a 0 25%,#5e493b 25% 50%,#a47c54 50% 75%,#d5bb8f 75%); }
    .litho { --swatches: linear-gradient(90deg,#0d0f12 0 25%,#454a50 25% 50%,#b6b3aa 50% 75%,#ede9dc 75%); }

    .dish { margin-top: 9px; border-block: 1px solid var(--line); }
    .dish-head {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 7px 1px 6px;
    }
    .dish-title { font-weight: 700; letter-spacing: .16em; }
    .dish-caption { color: var(--quiet); font-size: 8px; letter-spacing: .08em; }
    .dish-row {
      position: relative;
      display: grid;
      grid-template-columns: 78px 34px 1fr auto;
      align-items: center;
      min-height: 38px;
      padding: 4px 7px;
      border-top: 1px solid var(--line);
      background: var(--cell);
      cursor: pointer;
      user-select: none;
    }
    .dish-row:hover { background: color-mix(in srgb, var(--cell) 88%, var(--text)); }
    .dish-name { font-size: 8px; letter-spacing: .15em; }
    .dish-state, .dish-hint { color: var(--quiet); font-size: 8px; letter-spacing: .08em; }
    .dish-hint { justify-self: end; }
    .toggle {
      position: relative;
      width: 28px;
      height: 16px;
      border: 1px solid var(--line-hi);
      background: #050608;
      cursor: pointer;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 8px;
      height: 8px;
      background: var(--quiet);
      transition: transform .14s, background .14s;
    }
    .toggle.on { border-color: var(--cell-hi); }
    .toggle.on::after { transform: translateX(12px); background: var(--cell-hi); }
    .toggle.on + .dish-state { color: var(--text); }

    .map-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr);
      align-items: center;
      gap: 3px;
    }
    .map-arrow { color: var(--faint); text-align: center; }

    .editor-dock {
      position: fixed;
      z-index: 40;
      top: 48px;
      right: max(0px, calc((100vw - 790px) / 2));
      bottom: 0;
      width: 252px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--amber);
      background: #090a0c;
      box-shadow: -14px 0 30px rgba(0,0,0,.42);
      transform: translateX(105%);
      transition: transform .18s ease;
    }
    .editor-dock.open { transform: translateX(0); }
    .editor-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 8px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--amber-low);
    }
    .editor-kicker { color: var(--amber); font-size: 8px; letter-spacing: .16em; }
    .editor-title { margin-top: 4px; color: var(--amber); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .editor-close {
      width: 27px;
      height: 27px;
      border: 1px solid var(--amber-low);
      background: transparent;
      color: var(--amber);
      cursor: pointer;
    }
    .editor-close:hover, .editor-close:focus-visible { border-color: var(--amber); outline: none; }
    .editor-body { flex: 1; display: grid; align-content: start; gap: 14px; padding: 16px 13px; color: var(--amber); }
    .editor-readout {
      color: var(--amber);
      font-size: 24px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
    }
    .editor-unit { margin-left: 4px; color: color-mix(in srgb, var(--amber) 70%, transparent); font-size: 9px; letter-spacing: .08em; }
    .editor-note { color: color-mix(in srgb, var(--amber) 65%, transparent); font-size: 8px; line-height: 1.5; letter-spacing: .06em; text-transform: uppercase; }
    .editor-control { display: grid; gap: 10px; }
    .slider {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--amber);
      cursor: ew-resize;
    }
    .range-pair { display: grid; gap: 10px; }
    .dual-range {
      position: relative;
      height: 28px;
      background: linear-gradient(var(--amber-low), var(--amber-low)) center / 100% 2px no-repeat;
    }
    .dual-range .slider {
      position: absolute;
      inset: 5px 0 auto;
      width: 100%;
      height: 18px;
      margin: 0;
      background: transparent;
      pointer-events: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .dual-range .slider::-webkit-slider-runnable-track { height: 2px; background: transparent; }
    .dual-range .slider::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -7px; border: 1px solid var(--amber); border-radius: 0; background: #090a0c; pointer-events: auto; appearance: none; -webkit-appearance: none; cursor: ew-resize; }
    .dual-range .slider::-moz-range-track { height: 2px; background: transparent; }
    .dual-range .slider::-moz-range-thumb { width: 14px; height: 14px; border: 1px solid var(--amber); border-radius: 0; background: #090a0c; pointer-events: auto; cursor: ew-resize; }
    .range-values { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .range-values output { padding: 7px 8px; border: 1px solid var(--amber-low); font-variant-numeric: tabular-nums; }
    .range-values output:last-child { text-align: right; }
    .dial-wrap { display: grid; place-items: center; gap: 12px; }
    .dial {
      --angle: 0deg;
      position: relative;
      width: 112px;
      height: 112px;
      border: 1px solid var(--amber);
      border-radius: 50%;
      background: radial-gradient(circle at center, #11100d 0 51%, #090a0c 53% 100%);
      cursor: ns-resize;
      touch-action: none;
    }
    .dial::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 2px;
      height: 47px;
      background: var(--amber);
      transform-origin: 1px 47px;
      transform: translateX(-1px) rotate(var(--angle));
      box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 55%, transparent);
    }
    .dial::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: repeating-conic-gradient(var(--amber) 0 1deg, transparent 1deg 15deg);
      -webkit-mask: radial-gradient(circle, transparent 0 70%, #000 71% 74%, transparent 75%);
      mask: radial-gradient(circle, transparent 0 70%, #000 71% 74%, transparent 75%);
      opacity: .45;
    }
    .stepper { display: grid; grid-template-columns: 42px 1fr 42px; gap: 4px; }
    .stepper button, .blend-button {
      min-height: 38px;
      border: 1px solid var(--amber-low);
      background: transparent;
      color: var(--amber);
      cursor: pointer;
    }
    .stepper button:hover, .stepper button:focus-visible, .blend-button:hover, .blend-button:focus-visible { border-color: var(--amber); outline: none; }
    .stepper output { display: grid; place-items: center; border: 1px solid var(--amber); font-size: 20px; font-variant-numeric: tabular-nums; }
    .blend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .blend-button.selected { background: var(--amber); color: #08090b; }

    @media (max-width: 760px) {
      .instrument.editor-open .panel-body { padding-right: 12px; padding-bottom: 240px; }
      .editor-dock {
        top: auto;
        right: 0;
        left: 0;
        bottom: 0;
        width: min(100%, 790px);
        height: 224px;
        margin: 0 auto;
        border-top: 1px solid var(--amber);
        border-left: 0;
        box-shadow: 0 -14px 30px rgba(0,0,0,.5);
        transform: translateY(105%);
      }
      .editor-dock.open { transform: translateY(0); }
      .editor-head { padding: 8px 11px; }
      .editor-body { grid-template-columns: 92px 1fr; align-items: center; gap: 10px; padding: 10px 12px; overflow-y: auto; }
      .editor-note { grid-column: 1 / -1; }
      .dial { width: 88px; height: 88px; }
      .dial::before { height: 36px; transform-origin: 1px 36px; }
    }
    @media (max-width: 560px) {
      .instrument { border-inline: 0; }
      .topbar { padding-inline: 9px; }
      .top-note { display: none; }
      .panel-body { padding-inline: 9px; }
      .button-matrix { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .map-row { grid-template-columns: minmax(0,1fr) 14px minmax(0,1fr); }
      .map-row .amount-arrow, .map-row .amount { grid-column: auto; }
      .map-row .amount-arrow { display: none; }
      .map-row .amount { grid-column: 1 / -1; }
      .map-row .button-matrix { grid-template-columns: 1fr; }
      .map-row .matrix-button { white-space: normal; }
    }
    @media (max-width: 340px) {
      .build-mark::before { display: none; }
      .button-matrix { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .dish-row { grid-template-columns: 68px 32px 1fr; }
      .dish-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="instrument" aria-label="KC-1 Build panel mockup">
    <header class="topbar">
      <div class="build-mark">BUILD</div>
      <div class="top-note">looks, never presets</div>
      <button class="roll" type="button" title="Roll the tasteful dice" aria-label="Roll the tasteful dice">⚄ ROLL</button>
    </header>

    <div class="panel-body">
      <section class="section" aria-labelledby="layout-title">
        <h2 class="section-heading" id="layout-title"><span class="section-no">1</span> LAYOUT <span class="section-caption">PLACE</span></h2>
        <div class="button-matrix state-group" data-editor="density" data-title="layout density" data-value="62" data-unit="%" aria-label="Layout mode">
          <button class="matrix-button" type="button">rand</button><button class="matrix-button" type="button">grid</button><button class="matrix-button" type="button">phi</button><button class="matrix-button" type="button">rad</button><button class="matrix-button" type="button">noise</button><button class="matrix-button" type="button">strat</button><button class="matrix-button" type="button">flow</button><button class="matrix-button" type="button">rail</button><button class="matrix-button primary selected" type="button">layers</button><button class="matrix-button" type="button">ca</button><button class="matrix-button" type="button">orbit</button><button class="matrix-button" type="button">abacus</button><button class="matrix-button" type="button">coral</button><button class="matrix-button" type="button">bloom</button>
        </div>
        <div class="micro-label">values</div>
        <div class="button-matrix value-matrix" aria-label="Layout values">
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="count" data-title="count" data-value="320" data-min="1" data-max="1000" data-step="1"><span>COUNT</span><span class="value">320</span></button>
          <button class="matrix-button value-button" type="button" data-editor="range" data-key="scale" data-title="scale" data-low="0.4" data-high="1.6" data-min="0.1" data-max="3" data-step="0.1"><span>SCALE</span><span class="value">.4–1.6</span></button>
          <button class="matrix-button value-button" type="button" data-editor="dial" data-key="rotate" data-title="rotate" data-value="42" data-min="0" data-max="359" data-step="1" data-unit="°"><span>ROTATE</span><span class="value">42°</span></button>
          <button class="matrix-button value-button" type="button" data-editor="range" data-key="alpha" data-title="alpha" data-low="40" data-high="100" data-min="0" data-max="100" data-step="1" data-unit="%"><span>ALPHA</span><span class="value">40–100</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="density" data-title="density" data-value="62" data-min="0" data-max="100" data-step="1" data-unit="%"><span>DENSITY</span><span class="value">62%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="stepper" data-key="seed" data-title="seed" data-value="7" data-min="1" data-max="99" data-step="1"><span>SEED</span><span class="value">07</span></button>
        </div>
        <div class="micro-label">symmetry</div>
        <div class="button-matrix state-group" data-editor="dial" data-title="symmetry turn" data-value="0" data-unit="°" aria-label="Symmetry">
          <button class="matrix-button selected" type="button">NONE</button><button class="matrix-button" type="button">BILATERAL</button><button class="matrix-button" type="button">RADIAL-4</button><button class="matrix-button" type="button">RADIAL-6</button><button class="matrix-button" type="button">RADIAL-8</button><button class="matrix-button" type="button">STAMP</button>
        </div>
        <div class="micro-label">kineme</div>
        <div class="button-matrix state-group" data-editor="slider" data-title="rhythm amount" data-value="36" data-unit="%" aria-label="Kineme pattern">
          <button class="matrix-button selected" type="button">breath</button><button class="matrix-button" type="button">drift</button><button class="matrix-button" type="button">pulse</button><button class="matrix-button" type="button">wobble</button><button class="matrix-button" type="button">sine</button><button class="matrix-button" type="button">noise</button><button class="matrix-button" type="button">phase</button><button class="matrix-button" type="button">polyrhythm</button>
        </div>
      </section>

      <section class="section" aria-labelledby="cast-title">
        <h2 class="section-heading" id="cast-title"><span class="section-no">2</span> CAST <span class="section-caption">VOICE</span></h2>
        <div class="button-matrix state-group" data-editor="slider" data-title="voice depth" data-value="73" data-unit="%" aria-label="Voice">
          <button class="matrix-button" type="button">swarm</button><button class="matrix-button" type="button">hype</button><button class="matrix-button" type="button">murmur</button><button class="matrix-button selected" type="button">dark glass</button><button class="matrix-button" type="button">random</button><button class="matrix-button" type="button">grid</button><button class="matrix-button" type="button">fibonacci</button><button class="matrix-button" type="button">radial</button><button class="matrix-button" type="button">noise warp</button><button class="matrix-button" type="button">stratified</button><button class="matrix-button" type="button">wave</button><button class="matrix-button" type="button">rails</button><button class="matrix-button" type="button">layers</button><button class="matrix-button" type="button">cellular</button><button class="matrix-button" type="button">orbit</button><button class="matrix-button" type="button">abacus</button><button class="matrix-button" type="button">DLA growth</button><button class="matrix-button" type="button">Eden growth</button>
        </div>
        <div class="micro-label">values</div>
        <div class="button-matrix value-matrix" aria-label="Cast values">
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="frost" data-title="frost" data-value="68" data-min="0" data-max="100" data-step="1" data-unit="%"><span>FROST</span><span class="value">68%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="shimmer" data-title="shimmer" data-value="41" data-min="0" data-max="100" data-step="1" data-unit="%"><span>SHIMMER</span><span class="value">41%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="depth" data-title="depth" data-value="73" data-min="0" data-max="100" data-step="1" data-unit="%"><span>DEPTH</span><span class="value">73%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="glow" data-title="glass glow" data-value="36" data-min="0" data-max="100" data-step="1" data-unit="%"><span>GLOW</span><span class="value">36%</span></button>
        </div>
        <div class="dish">
          <div class="dish-head"><span class="dish-title">DISH</span><span class="dish-caption">what's in the dish</span></div>
          <div class="dish-row" tabindex="0" data-name="MATH" data-value="25"><span class="dish-name">MATH</span><button class="toggle" type="button" aria-label="Toggle math" aria-pressed="false"></button><span class="dish-state">OFF</span><span class="dish-hint">TAP / HOLD</span></div>
          <div class="dish-row" tabindex="0" data-name="FX" data-value="54"><span class="dish-name">FX</span><button class="toggle on" type="button" aria-label="Toggle FX" aria-pressed="true"></button><span class="dish-state">ON</span><span class="dish-hint">TAP / HOLD</span></div>
          <div class="dish-row" tabindex="0" data-name="CONTENT" data-value="81"><span class="dish-name">CONTENT</span><button class="toggle on" type="button" aria-label="Toggle content" aria-pressed="true"></button><span class="dish-state">ON</span><span class="dish-hint">TAP / HOLD</span></div>
        </div>
      </section>

      <section class="section" aria-labelledby="motion-title">
        <h2 class="section-heading" id="motion-title"><span class="section-no">3</span> MOTION &amp; BEHAVIOR <span class="section-caption">MOVE</span></h2>
        <div class="micro-label">motion</div>
        <div class="button-matrix state-group" data-editor="slider" data-title="motion amount" data-value="57" data-unit="%" aria-label="Motion">
          <button class="matrix-button" type="button">still</button><button class="matrix-button selected" type="button">drift</button><button class="matrix-button" type="button">river</button><button class="matrix-button" type="button">flock</button><button class="matrix-button" type="button">orbit</button><button class="matrix-button" type="button">scatter</button><button class="matrix-button" type="button">mold</button>
        </div>
        <div class="micro-label">behave</div>
        <div class="button-matrix state-group" data-editor="slider" data-title="behavior weight" data-value="44" data-unit="%" aria-label="Behavior">
          <button class="matrix-button selected" type="button">CRUISE</button><button class="matrix-button" type="button">FLOCK</button><button class="matrix-button" type="button">ORBIT</button><button class="matrix-button" type="button">SCATTER</button><button class="matrix-button" type="button">MOLD</button><button class="matrix-button" type="button">LEVY</button><button class="matrix-button" type="button">LORENZ</button><button class="matrix-button" type="button">SEEK</button><button class="matrix-button" type="button">FLEE</button>
        </div>
        <div class="micro-label">values</div>
        <div class="button-matrix value-matrix" aria-label="Motion values">
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="tempo" data-title="tempo" data-value="44" data-min="0" data-max="240" data-step="1" data-unit="bpm"><span>TEMPO</span><span class="value">44</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="drift" data-title="drift" data-value="57" data-min="0" data-max="100" data-step="1" data-unit="%"><span>DRIFT</span><span class="value">57%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="swarm" data-title="swarm" data-value="34" data-min="0" data-max="100" data-step="1" data-unit="%"><span>SWARM</span><span class="value">34%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="gust" data-title="gust" data-value="19" data-min="0" data-max="100" data-step="1" data-unit="%"><span>GUST</span><span class="value">19%</span></button>
        </div>
      </section>

      <section class="section" aria-labelledby="appearance-title">
        <h2 class="section-heading" id="appearance-title"><span class="section-no">4</span> APPEARANCE <span class="section-caption">FINISH</span></h2>
        <div class="button-matrix state-group palette-group" data-editor="dial" data-title="palette hue-rot" data-value="0" data-unit="°" aria-label="Palette">
          <button class="matrix-button palette-button grown" type="button">GROWN</button><button class="matrix-button palette-button vortex" type="button">VORTEX</button><button class="matrix-button palette-button sepia" type="button">SEPIA PLATE</button><button class="matrix-button palette-button litho selected" type="button">LITHOGRAPH</button>
        </div>
        <div class="micro-label">values</div>
        <div class="button-matrix value-matrix" aria-label="Appearance values">
          <button class="matrix-button value-button" type="button" data-editor="dial" data-key="hue" data-title="hue-rot" data-value="18" data-min="0" data-max="359" data-step="1" data-unit="°"><span>HUE-ROT</span><span class="value">18°</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="grain" data-title="grain" data-value="46" data-min="0" data-max="100" data-step="1" data-unit="%"><span>GRAIN</span><span class="value">46%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="halo" data-title="halo" data-value="28" data-min="0" data-max="100" data-step="1" data-unit="%"><span>HALO</span><span class="value">28%</span></button>
          <button class="matrix-button value-button" type="button" data-editor="slider" data-key="fade" data-title="fade" data-value="12" data-min="0" data-max="100" data-step="1" data-unit="%"><span>FADE</span><span class="value">12%</span></button>
        </div>
        <div class="micro-label">map</div>
        <div class="map-row" aria-label="Field to channel mapping">
          <div class="button-matrix state-group" data-editor="slider" data-title="field influence" data-value="58" data-unit="%"><button class="matrix-button selected" type="button">NOISE FIELD</button><button class="matrix-button" type="button">DISTANCE</button></div>
          <span class="map-arrow" aria-hidden="true">→</span>
          <div class="button-matrix state-group" data-editor="slider" data-title="channel response" data-value="58" data-unit="%"><button class="matrix-button selected" type="button">SCALE</button><button class="matrix-button" type="button">SATURATION</button></div>
          <span class="map-arrow amount-arrow" aria-hidden="true">→</span>
          <button class="matrix-button value-button amount" type="button" data-editor="slider" data-key="amount" data-title="map amount" data-value="58" data-min="0" data-max="100" data-step="1" data-unit="%"><span>AMOUNT</span><span class="value">58%</span></button>
        </div>
      </section>
    </div>

    <aside class="editor-dock" aria-hidden="true" aria-label="Value editor">
      <div class="editor-head">
        <div><div class="editor-kicker">EDIT VALUE</div><div class="editor-title">COUNT</div></div>
        <button class="editor-close" type="button" aria-label="Close editor">×</button>
      </div>
      <div class="editor-body"></div>
    </aside>
  </main>

  <script>
    (function () {
      var instrument = document.querySelector('.instrument');
      var dock = document.querySelector('.editor-dock');
      var dockTitle = dock.querySelector('.editor-title');
      var dockBody = dock.querySelector('.editor-body');
      var activeLauncher = null;
      var holdTimer = null;
      var held = false;

      function number(value) { return Number(value); }
      function clean(value, step) {
        var places = String(step || 1).indexOf('.') > -1 ? String(step).split('.')[1].length : 0;
        return Number(value).toFixed(places).replace(/^0\./, '.');
      }
      function showDock(title, html) {
        dockTitle.textContent = title;
        dockBody.innerHTML = html;
        dock.classList.add('open');
        dock.setAttribute('aria-hidden', 'false');
        instrument.classList.add('editor-open');
      }
      function closeDock() {
        dock.classList.remove('open');
        dock.setAttribute('aria-hidden', 'true');
        instrument.classList.remove('editor-open');
        activeLauncher = null;
      }
      function valueLabel(el, value) {
        var unit = el.dataset.unit || '';
        if (el.dataset.key === 'seed') return String(Math.round(value)).padStart(2, '0');
        return clean(value, el.dataset.step) + unit;
      }
      function syncLauncher(el, value) {
        if (!el) return;
        el.dataset.value = value;
        var out = el.querySelector('.value');
        if (out) out.textContent = valueLabel(el, value);
      }
      function openSlider(el, title, value, min, max, step, unit) {
        activeLauncher = el;
        showDock(title,
          '<div><span class="editor-readout">' + clean(value, step) + '</span><span class="editor-unit">' + unit + '</span></div>' +
          '<div class="editor-control"><input class="slider editor-slider" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '" aria-label="' + title + '"></div>' +
          '<div class="editor-note">DRAG TO SET · TAP OUTSIDE TO CLOSE</div>');
        var slider = dockBody.querySelector('.editor-slider');
        slider.addEventListener('input', function () {
          dockBody.querySelector('.editor-readout').textContent = clean(slider.value, step);
          syncLauncher(el, slider.value);
        });
      }
      function openDial(el, title, value, unit) {
        activeLauncher = el;
        var current = ((number(value) % 360) + 360) % 360;
        showDock(title,
          '<div><span class="editor-readout">' + Math.round(current) + '</span><span class="editor-unit">' + unit + '</span></div>' +
          '<div class="dial-wrap"><div class="dial" tabindex="0" role="slider" aria-label="' + title + '" aria-valuemin="0" aria-valuemax="359" aria-valuenow="' + current + '"></div></div>' +
          '<div class="editor-note">DRAG VERTICAL · WRAPS AT 360</div>');
        var dial = dockBody.querySelector('.dial');
        var startY = 0;
        var start = current;
        function set(next) {
          current = ((Math.round(next) % 360) + 360) % 360;
          dial.style.setProperty('--angle', current + 'deg');
          dial.setAttribute('aria-valuenow', current);
          dockBody.querySelector('.editor-readout').textContent = current;
          syncLauncher(el, current);
        }
        set(current);
        dial.addEventListener('pointerdown', function (event) {
          event.preventDefault(); startY = event.clientY; start = current; dial.setPointerCapture(event.pointerId);
        });
        dial.addEventListener('pointermove', function (event) {
          if (!dial.hasPointerCapture(event.pointerId)) return;
          set(start + (startY - event.clientY) * 1.6);
        });
        dial.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowUp' && event.key !== 'ArrowRight' && event.key !== 'ArrowDown' && event.key !== 'ArrowLeft') return;
          event.preventDefault();
          set(current + ((event.key === 'ArrowUp' || event.key === 'ArrowRight') ? (event.shiftKey ? 15 : 1) : (event.shiftKey ? -15 : -1)));
        });
      }
      function openRange(el) {
        activeLauncher = el;
        var low = number(el.dataset.low), high = number(el.dataset.high), min = number(el.dataset.min), max = number(el.dataset.max), step = number(el.dataset.step || 1), unit = el.dataset.unit || '';
        showDock(el.dataset.title,
          '<div><span class="editor-readout">' + clean(low, step) + '–' + clean(high, step) + '</span><span class="editor-unit">' + unit + '</span></div>' +
          '<div class="range-pair">' +
            '<div class="dual-range" aria-label="' + el.dataset.title + ' range"><input class="slider low" aria-label="Minimum" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + low + '"><input class="slider high" aria-label="Maximum" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + high + '"></div>' +
            '<div class="range-values"><output class="low-out">MIN ' + clean(low, step) + '</output><output class="high-out">MAX ' + clean(high, step) + '</output></div>' +
          '</div><div class="editor-note">TWO HANDLES · MIN CANNOT PASS MAX</div>');
        var lowInput = dockBody.querySelector('.low'), highInput = dockBody.querySelector('.high');
        function update(which) {
          if (number(lowInput.value) > number(highInput.value)) {
            if (which === lowInput) highInput.value = lowInput.value; else lowInput.value = highInput.value;
          }
          el.dataset.low = lowInput.value; el.dataset.high = highInput.value;
          dockBody.querySelector('.editor-readout').textContent = clean(lowInput.value, step) + '–' + clean(highInput.value, step);
          dockBody.querySelector('.low-out').textContent = 'MIN ' + clean(lowInput.value, step);
          dockBody.querySelector('.high-out').textContent = 'MAX ' + clean(highInput.value, step);
          el.querySelector('.value').textContent = clean(lowInput.value, step) + '–' + clean(highInput.value, step) + unit;
        }
        lowInput.addEventListener('input', function () { update(lowInput); });
        highInput.addEventListener('input', function () { update(highInput); });
      }
      function openStepper(el) {
        activeLauncher = el;
        var value = number(el.dataset.value), min = number(el.dataset.min), max = number(el.dataset.max), step = number(el.dataset.step || 1);
        showDock(el.dataset.title,
          '<div><span class="editor-readout">' + Math.round(value) + '</span></div>' +
          '<div class="stepper"><button type="button" data-delta="-' + step + '" aria-label="Decrease">−</button><output>' + Math.round(value) + '</output><button type="button" data-delta="' + step + '" aria-label="Increase">+</button></div>' +
          '<div class="editor-note">DETENTED INTEGER</div>');
        dockBody.querySelectorAll('.stepper button').forEach(function (button) {
          button.addEventListener('click', function () {
            value = Math.max(min, Math.min(max, value + number(button.dataset.delta)));
            dockBody.querySelector('.editor-readout').textContent = Math.round(value);
            dockBody.querySelector('.stepper output').textContent = Math.round(value);
            syncLauncher(el, value);
          });
        });
      }
      function openBlend(row) {
        activeLauncher = row;
        var selected = row.dataset.blend || 'NORMAL';
        showDock(row.dataset.name + ' blend',
          '<div><span class="editor-readout">' + selected + '</span></div>' +
          '<div class="blend-grid">' + ['NORMAL','SCREEN','MULTIPLY','ADD'].map(function (mode) { return '<button class="blend-button' + (mode === selected ? ' selected' : '') + '" type="button">' + mode + '</button>'; }).join('') + '</div>' +
          '<div class="editor-note">HOLD A DISH ROW TO RETURN HERE</div>');
        dockBody.querySelectorAll('.blend-button').forEach(function (button) {
          button.addEventListener('click', function () {
            row.dataset.blend = button.textContent;
            dockBody.querySelector('.editor-readout').textContent = button.textContent;
            dockBody.querySelectorAll('.blend-button').forEach(function (item) { item.classList.toggle('selected', item === button); });
          });
        });
      }
      function openFor(el) {
        var type = el.dataset.editor || 'slider';
        var title = el.dataset.title || el.textContent.trim();
        var value = number(el.dataset.value || 50);
        if (type === 'dial') openDial(el, title, value, el.dataset.unit || '°');
        else if (type === 'range') openRange(el);
        else if (type === 'stepper') openStepper(el);
        else openSlider(el, title, value, number(el.dataset.min || 0), number(el.dataset.max || 100), number(el.dataset.step || 1), el.dataset.unit || '');
      }

      document.querySelectorAll('.state-group').forEach(function (group) {
        group.addEventListener('click', function (event) {
          var item = event.target.closest('.matrix-button');
          if (!item || !group.contains(item)) return;
          group.querySelectorAll('.matrix-button').forEach(function (button) { button.classList.remove('selected', 'primary'); });
          item.classList.add('selected');
          openFor(group);
        });
      });
      document.querySelectorAll('.value-button').forEach(function (button) {
        button.addEventListener('click', function () { openFor(button); });
      });
      document.querySelectorAll('.toggle').forEach(function (toggle) {
        toggle.addEventListener('click', function (event) {
          event.stopPropagation();
          var on = toggle.classList.toggle('on');
          toggle.setAttribute('aria-pressed', String(on));
          toggle.nextElementSibling.textContent = on ? 'ON' : 'OFF';
        });
      });
      document.querySelectorAll('.dish-row').forEach(function (row) {
        row.addEventListener('pointerdown', function (event) {
          if (event.target.closest('.toggle')) return;
          held = false;
          holdTimer = setTimeout(function () { held = true; openBlend(row); }, 520);
        });
        ['pointerup','pointercancel','pointerleave'].forEach(function (type) { row.addEventListener(type, function () { clearTimeout(holdTimer); }); });
        row.addEventListener('click', function (event) {
          if (event.target.closest('.toggle') || held) { held = false; return; }
          openSlider(row, row.dataset.name + ' depth', number(row.dataset.value), 0, 100, 1, '%');
        });
        row.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openSlider(row, row.dataset.name + ' depth', number(row.dataset.value), 0, 100, 1, '%'); }
        });
      });
      document.querySelector('.editor-close').addEventListener('click', closeDock);
      document.addEventListener('pointerdown', function (event) {
        if (!dock.classList.contains('open')) return;
        if (dock.contains(event.target) || event.target.closest('.matrix-button, .dish-row, .toggle')) return;
        closeDock();
      });
      document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeDock(); });

      var roll = document.querySelector('.roll');
      roll.addEventListener('click', function () {
        roll.classList.remove('shake'); void roll.offsetWidth; roll.classList.add('shake');
        document.querySelectorAll('.state-group').forEach(function (group) {
          var items = group.querySelectorAll('.matrix-button');
          if (!items.length) return;
          var chosen = items[Math.floor(Math.random() * items.length)];
          items.forEach(function (item) { item.classList.remove('selected', 'primary'); });
          chosen.classList.add('selected');
        });
        document.querySelectorAll('.value-button[data-value]').forEach(function (button) {
          var min = number(button.dataset.min || 0), max = number(button.dataset.max || 100), step = number(button.dataset.step || 1);
          var next = Math.round((min + Math.random() * (max - min)) / step) * step;
          syncLauncher(button, next);
        });
      });
    })();
  </script>
</body>
</html>
