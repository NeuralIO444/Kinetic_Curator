[package]
name = "kinetic-curator"
version = "0.9.0"
description = "Kinetic Curator Native Container"
authors = ["NeuralIO"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = [ "fs-all", "path-all", "window-close", "window-create", "window-set-decorations", "window-set-focus", "window-set-fullscreen", "window-set-position", "window-set-size", "window-set-skip-taskbar", "window-set-title" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metal = "0.31.0"
libc = "0.2.189"
objc = "0.2.7"
sha2 = "0.10"   # #1479 loot folder: streamed SHA-256 of a file (already in the tree via tauri)
base64 = "0.21" # #1479 loot folder: a file to JS as a string, not a JSON number array

[features]
custom-protocol = ["tauri/custom-protocol"]
