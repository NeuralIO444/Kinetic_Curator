name: CI

on:
  # Main only on push. PRs only on pull_request.
  # Do not add push: ** — that doubles every PR update.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Self-hosted on the Mac Studio (label mac-studio): the e2e/selfcheck jobs ran for minutes-to-hours on GitHub's software-GL
# runners and flaked on timing. Playwright uses the macOS cache path and no --with-deps (that flag is for Ubuntu).
# One runner = jobs queue one at a time; fork PRs run code on this Mac, so keep Settings > Actions > 'Require approval
# for all outside collaborators' on.
# Same three job names as before — branch protection still matches.
# No `needs` between them: lint no longer blocks browser install.
jobs:
  lint-build-selfcheck:
    runs-on: [self-hosted, mac-studio]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm run selfcheck runs swarmWasm.selfcheck -> scripts/build-wasm.sh --verify,
      # which needs the pinned toolchain (rust/rust-toolchain.toml) on PATH. The
      # runner service PATH has no cargo; install the pin explicitly.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run selfcheck
      - run: npm run build

  e2e-smoke:
    runs-on: [self-hosted, mac-studio]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-1.49.1-${{ runner.os }}
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true

  selfcheck-browser:
    runs-on: [self-hosted, mac-studio]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-1.49.1-${{ runner.os }}
      # npm run selfcheck runs swarmWasm.selfcheck -> scripts/build-wasm.sh --verify,
      # which needs the pinned toolchain (rust/rust-toolchain.toml) on PATH. The
      # runner service PATH has no cargo; install the pin explicitly.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install chromium
      - run: npm run selfcheck

  # Added 2026-10-03 (cleanup lane C): the Rust shell had no compile gate at
  # all — #827 (2026-10-01) deleted write_batch_frame's signature, main.rs
  # stopped parsing, and every JS check stayed green while the crate rotted.
  # macOS only: Tauri v1 + metal + libc's mach_* APIs don't build on the
  # ubuntu runners above. Suggested follow-up (same as selfcheck-browser's):
  # mark this check required in branch protection.
  cargo-check:
    runs-on: [self-hosted, mac-studio]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri::generate_context! embeds ../app/dist at compile time
      # (tauri.conf.json distDir), so the crate won't check without this.
      - run: npm ci --no-fund --no-audit
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked --all-targets
