name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-selfcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Install including any new devDeps not yet in lock (Playwright)
      - run: npm install --no-fund --no-audit
      - run: npm run lint
      - run: npm run selfcheck
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-build-selfcheck
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-fund --no-audit
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true

  # The lint job has no browser, so every browser-backed selfcheck (GL parity,
  # accum, composite, uniform-sweep property tests, debug sweep) SKIPS there and
  # the job is green without having run them. This job installs Chromium and runs
  # the whole chain so those suites actually gate. Parallel with e2e-smoke.
  selfcheck-browser:
    runs-on: ubuntu-latest
    needs: lint-build-selfcheck
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install --no-fund --no-audit
      - run: npx playwright install chromium --with-deps
      - run: npm run selfcheck
