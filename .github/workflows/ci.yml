name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same three job names as before — branch protection still matches.
# No `needs` between them: lint no longer blocks browser install.
jobs:
  lint-build-selfcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run selfcheck
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-${{ runner.os }}
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true

  # Lint has no browser, so GL suites skip there. This job installs
  # Chromium and runs the whole chain. Starts with lint (no needs).
  selfcheck-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-${{ runner.os }}
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install chromium --with-deps
      - run: npm run selfcheck
