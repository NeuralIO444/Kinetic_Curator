[project]
name = "kinetic-curator-studio"
version = "0.1.0"
description = "Headless render farm for Kinetic Curator (Backend A, issue #74)"
requires-python = ">=3.11"
# Stdlib only. resvg and ffmpeg are native binaries (brew install resvg ffmpeg),
# not Python packages — the plan named resvg-py, but shelling out to the CLI
# removes a build dependency and parallelises the same way.
dependencies = []

[project.optional-dependencies]
# Only needed by verify.py, which compares this pipeline against the browser.
verify = ["pillow>=11", "numpy>=2"]
# geom.py only (asset audit + blend, issue #76). studio.py stays stdlib-only.
geom = ["svgpathtools>=1.6", "numpy>=2"]
# curator.py (#75) — SigLIP taste model on Apple MLX. Weights live in the HF cache.
# mlx-embeddings only runs on Apple Silicon, hence the darwin marker: installing
# the extra on Linux/macOS-Intel just skips it. (The old torch/open_clip backend
# is gone; indexes must be rebuilt with `curator.py embed`.)
curator = ["mlx-embeddings>=0.1; sys_platform=='darwin'", "pillow>=11", "numpy>=2", "scikit-learn>=1.5"]
# genassets.py (#77) — local diffusion -> vector. Gated on the curator.
gen = ["diffusers>=0.31", "transformers>=4.44", "accelerate>=1.0", "vtracer>=0.6", "torch>=2.4"]

[project.scripts]
studio = "studio:main"

[tool.uv]
package = false
