<!doctype html>
<html>
<head><meta charset="utf-8"><title>gl debug selfcheck</title></head>
<body>
<script type="module">
import { runAll, runSweepSection, runMeasureSection } from './selfcheck.page.mjs';
try {
  // ?only=sweep runs just the uniform-sweep section (npm run selfcheck:sweep).
  // ?only=measure runs the GPU cost measurement (npm run measure-costs).
  const only = new URLSearchParams(location.search).get('only');
  if (only === 'measure') {
    // Measurement only: the measurer is parked on window.__kcMeasure for
    // the node driver (costTiers.measure.mjs), which times each batch
    // itself and commits effects/measuredCosts.mjs.
    const { lines } = await runMeasureSection();
    window.__kcDebugResult = { ok: true, lines, failures: [] };
  } else {
    const { lines, failures } = only === 'sweep' ? runSweepSection() : runAll();
    window.__kcDebugResult = { ok: failures.length === 0, lines, failures };
  }
} catch (e) {
  window.__kcDebugResult = { ok: false, lines: [], failures: ['harness'], error: String((e && e.stack) || e) };
}
window.__kcDebugDone = true;
</script>
</body>
</html>
