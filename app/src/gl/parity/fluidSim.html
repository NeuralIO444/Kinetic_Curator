<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GPU fluid kernel probe (K1 #2186)</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import { createGpuFluid } from '../fluidSim.mjs';
// window.__kcFluidRun({ cols, rows, u, v, steps, opts, culture:{level,cw,ch}|null, sampleEvery }) -> { u, v, samples }
// Seeds the GPU fluid from (u, v), runs `steps` passes under `opts`, returns the final field and, every
// `sampleEvery` steps, { step, minU, maxU, minV, maxV, meanV, finite } for the stability soak.
const gl = document.getElementById('c').getContext('webgl2', { alpha: false, antialias: false });
window.__kcFluidRun = (p) => {
  const g = createGpuFluid(gl, p.cols, p.rows);
  g.seed(Float32Array.from(p.u), Float32Array.from(p.v));
  if (p.culture) g.setCulture(Float32Array.from(p.culture.level), p.culture.cw, p.culture.ch);
  const samples = [];
  const every = p.sampleEvery || 0;
  let done = 0;
  while (done < p.steps) {
    const n = every ? Math.min(every, p.steps - done) : p.steps - done;
    g.step(n, p.opts);
    done += n;
    if (every) {
      const { u, v } = g.read();
      let minU = 9, maxU = -9, minV = 9, maxV = -9, sv = 0, finite = true;
      for (let i = 0; i < u.length; i++) {
        if (!Number.isFinite(u[i]) || !Number.isFinite(v[i])) finite = false;
        minU = Math.min(minU, u[i]); maxU = Math.max(maxU, u[i]);
        minV = Math.min(minV, v[i]); maxV = Math.max(maxV, v[i]);
        sv += v[i];
      }
      samples.push({ step: done, minU, maxU, minV, maxV, meanV: sv / u.length, finite });
    }
  }
  const { u, v } = g.read();
  return { u: Array.from(u), v: Array.from(v), samples };
};
// window.__kcFluidSession* — a SEGMENTED run (CULTURE Phase 3B): one seeded GPU fluid stepped in
// segments, each segment optionally re-dealing the culture texture first. This is how a parity
// scenario mirrors a world whose fluid reads a culture level that changes at generation
// boundaries mid-run: same seed, same per-segment inputs, same step counts as the JS world took.
window.__kcFluidSessions = new Map();
let __kcFluidSessionSeq = 0;
window.__kcFluidSessionOpen = (p) => {
  const g = createGpuFluid(gl, p.cols, p.rows);
  g.seed(Float32Array.from(p.u), Float32Array.from(p.v));
  const id = ++__kcFluidSessionSeq;
  window.__kcFluidSessions.set(id, g);
  return id;
};
window.__kcFluidSessionStep = (id, p) => {
  const g = window.__kcFluidSessions.get(id);
  if (p.culture) g.setCulture(Float32Array.from(p.culture.level), p.culture.cw, p.culture.ch);
  g.step(p.steps, p.opts);
  return true;
};
window.__kcFluidSessionRead = (id) => {
  const { u, v } = window.__kcFluidSessions.get(id).read();
  return { u: Array.from(u), v: Array.from(v) };
};
window.__kcReady = true;
</script>
</body>
</html>
