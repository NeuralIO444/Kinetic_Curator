<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GPU swarm kernel probe (K3 #2188)</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import { createGpuSwarm } from '../swarmSim.mjs';
import { createGpuSwarmHost } from '../gpuSwarmHost.mjs';
import { createCultureSwarmHost } from '../cultureSwarmHost.mjs';
import { createCultureWorld, stepCultureWorld } from '../../engine/cultureWorld.mjs';
import { ParticleSystem } from '../../engine/particles.js';
import { DEFAULT_LAYOUT_PARAMS, normalizeLayoutParams } from '../../data/layout-modes.js';
import { createScentField } from '../../engine/kernel/field/scent.js';
// window.__kcSwarmRun({ n, state: { x, y, vx, vy, mass }, steps, params, sampleAt: [steps...] }) -> { samples: { step: {x,y,vx,vy} } }
// Seeds the GPU swarm, runs `steps` substeps under `params`; returns the state after each step listed in sampleAt (and the last).
const gl = document.getElementById('c').getContext('webgl2', { alpha: false, antialias: false });
window.__kcSwarmRun = (p) => {
  const g = createGpuSwarm(gl, p.n);
  const f32 = (a) => Float32Array.from(a);
  g.seed({ x: f32(p.state.x), y: f32(p.state.y), vx: f32(p.state.vx), vy: f32(p.state.vy), mass: f32(p.state.mass), seedOffset: p.state.seedOffset ? f32(p.state.seedOffset) : undefined, energy: p.state.energy ? f32(p.state.energy) : undefined, drive: p.state.drive ? f32(p.state.drive) : undefined, leakRgb: p.state.leakRgb ? f32(p.state.leakRgb) : undefined, lorenz: p.state.lorenz ? { x: f32(p.state.lorenz.x), y: f32(p.state.lorenz.y), z: f32(p.state.lorenz.z) } : undefined, rotation: p.state.rotation ? f32(p.state.rotation) : undefined });
  if (p.scent) g.setScent(Float32Array.from(p.scent.cells), p.scent.cols, p.scent.rows);
  const at = new Set(p.sampleAt || [p.steps]);
  const samples = {};
  for (let s = 1; s <= p.steps; s++) {
    g.step(p.params);
    if (at.has(s)) {
      const r = g.read();
      samples[s] = { x: Array.from(r.x), y: Array.from(r.y), vx: Array.from(r.vx), vy: Array.from(r.vy) };
      if (p.state.energy) {
        const d = g.readDrives();
        samples[s].dr = { energy: Array.from(d.energy), drive: Array.from(d.drive), leakRgb: Array.from(d.leakRgb) };
      }
      if (p.spineLen) {
        const sp = g.readSpine(p.spineLen);
        samples[s].spine = { x: Array.from(sp.x), y: Array.from(sp.y) };
      }
      if (p.state.rotation) samples[s].rotation = Array.from(g.readDrives().rotation);
      if (p.state.lorenz) {
        const l = g.readLorenz();
        samples[s].lz = { x: Array.from(l.x), y: Array.from(l.y), z: Array.from(l.z) };
      }
    }
  }
  g.dispose();
  return { samples };
};
// window.__kcShadowRun({ n, steps, seed }) -> stats: the K3 wiring shadow over a real ParticleSystem (pre -> JS step -> post, per step).
window.__kcShadowRun = (p) => {
  const W = 1000;
  const H = 700;
  const assets = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
  const palette = { swatches: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'], ...(p.palette || {}) };
  const lp = normalizeLayoutParams({ ...DEFAULT_LAYOUT_PARAMS, mode: 'swarm', behave: 'cruise', particleCount: p.n, ...(p.lp || {}) });
  const sys = new ParticleSystem();
  sys.init(p.n, W, H, assets, palette, p.seed);
  const host = createGpuSwarmHost(gl);
  // takeover: a pure-JS twin from the same seed, stepped beside the system the GPU's velocities drive
  let twin = null;
  let drift = 0;
  if (p.live) {
    twin = new ParticleSystem();
    twin.init(p.n, W, H, assets, palette, p.seed);
  }
  for (const k of p.kill || []) {
    sys.alive[k] = 0;
    if (twin) twin.alive[k] = 0;
  }
  // p.scentDeposits: each system gets its OWN shared field, pre-laid identically (the resolver hands every layer the one field; here two
  // systems must not deposit into the same ground, or the twin would read the other's marks)
  const mkField = () => {
    if (!p.scentDeposits) return null;
    const f = createScentField();
    for (const d of p.scentDeposits) f.deposit(d.x, d.y, d.amount);
    for (let k = 0; k < 6; k++) f.step();
    return f;
  };
  const fieldSys = mkField();
  const fieldTwin = mkField();
  const lpSys = fieldSys ? { ...lp, scentField: fieldSys } : lp;
  const lpTwin = fieldTwin ? { ...lp, scentField: fieldTwin } : lp;
  const T0 = 1_000_000;
  let toks = 0;
  for (let s = 0; s < p.steps; s++) {
    const t = T0 + s * (1000 / 60);
    const att = p.attractor || null;
    const tok = host.pre('L', sys, lpSys, { attractor: att, canvasW: W, canvasH: H, loopTimeMs: t, seedOffsets: null, slowRender: false }, { force: !!p.live });
    if (tok) toks++;
    const seam = p.live ? host.seam(tok) : null;
    sys.update(seam ? { ...lpSys, ...seam } : lpSys, assets, palette, p.seed, t, att);
    if (twin) {
      twin.update(lpTwin, assets, palette, p.seed, t, att);
      for (let i = 0; i < p.n; i++) if (sys.alive[i]) drift = Math.max(drift, Math.abs(sys.x[i] - twin.x[i]), Math.abs(sys.y[i] - twin.y[i]));
    }
    host.post(tok, sys);
  }
  // the slow state (drives, Lorenz phase, pigment) against the twin's, for the takeover
  const slow = { energy: 0, drive: 0, lorenz: 0, leak: 0 };
  if (twin)
    for (let i = 0; i < p.n; i++) {
      if (!sys.alive[i]) continue;
      slow.energy = Math.max(slow.energy, Math.abs(sys.energy[i] - twin.energy[i]));
      slow.drive = Math.max(slow.drive, Math.abs(sys.drive[i] - twin.drive[i]));
      slow.lorenz = Math.max(slow.lorenz, Math.abs(sys.lorenzX[i] - twin.lorenzX[i]), Math.abs(sys.lorenzY[i] - twin.lorenzY[i]), Math.abs(sys.lorenzZ[i] - twin.lorenzZ[i]));
      for (let k = 0; k < 3; k++) slow.leak = Math.max(slow.leak, Math.abs(sys.leakRgb[i * 3 + k] - twin.leakRgb[i * 3 + k]));
    }
  let speedMax = 0;
  let finite = true;
  for (let i = 0; i < p.n; i++) {
    if (![sys.x[i], sys.y[i], sys.vx[i], sys.vy[i]].every(Number.isFinite)) finite = false;
    speedMax = Math.max(speedMax, Math.hypot(sys.vx[i], sys.vy[i]));
  }
  const out = { ...host.stats, toks, drift, speedMax, finite, slow };
  host.dispose();
  return out;
};
// window.__kcCultureSwarmHostRun({ seed, deal: { x, y, vx, vy, mass, radius }, worldSteps })
//   -> { world: {x,y,vx,vy}, mirror: {x,y,vx,vy} | null, swarmStep, backend }
// CULTURE Phase 1 K3: deals the population into a fresh culture world, steps the world
// through its own scheduler with the GPU culture-swarm host mirroring every frame, and
// returns the world's JS state and the mirror's state at the end.
window.__kcCultureSwarmHostRun = (p) => {
  const w = createCultureWorld({ seed: p.seed });
  const b = w.bodies;
  const n = p.deal.x.length;
  for (let i = 0; i < n; i++) {
    b.alive[i] = 1;
    b.x[i] = p.deal.x[i];
    b.y[i] = p.deal.y[i];
    b.vx[i] = p.deal.vx[i];
    b.vy[i] = p.deal.vy[i];
    b.mass[i] = p.deal.mass[i];
    b.radius[i] = p.deal.radius[i];
  }
  b.count = n;
  const host = createCultureSwarmHost(gl);
  let mirror = null;
  for (let s = 0; s < p.worldSteps; s++) {
    stepCultureWorld(w);
    mirror = host.frame(w);
  }
  host.dispose();
  const take = (arr) => Array.from(arr.subarray(0, n));
  return {
    world: { x: take(b.x), y: take(b.y), vx: take(b.vx), vy: take(b.vy) },
    mirror: mirror ? { x: Array.from(mirror.state.x), y: Array.from(mirror.state.y), vx: Array.from(mirror.state.vx), vy: Array.from(mirror.state.vy) } : null,
    swarmStep: b.step,
    mirrorStep: mirror ? mirror.swarmStep : -1,
    backend: mirror ? mirror.backend : null,
  };
};
window.__kcReady = true;
</script>
</body>
</html>
