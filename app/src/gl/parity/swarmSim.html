<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GPU swarm kernel probe (K3 #2188)</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import { createGpuSwarm } from '../swarmSim.mjs';
import { createGpuSwarmHost } from '../gpuSwarmHost.mjs';
import { ParticleSystem } from '../../engine/particles.js';
import { DEFAULT_LAYOUT_PARAMS, normalizeLayoutParams } from '../../data/layout-modes.js';
// window.__kcSwarmRun({ n, state: { x, y, vx, vy, mass }, steps, params, sampleAt: [steps...] }) -> { samples: { step: {x,y,vx,vy} } }
// Seeds the GPU swarm, runs `steps` substeps under `params`; returns the state after each step listed in sampleAt (and the last).
const gl = document.getElementById('c').getContext('webgl2', { alpha: false, antialias: false });
window.__kcSwarmRun = (p) => {
  const g = createGpuSwarm(gl, p.n);
  const f32 = (a) => Float32Array.from(a);
  g.seed({ x: f32(p.state.x), y: f32(p.state.y), vx: f32(p.state.vx), vy: f32(p.state.vy), mass: f32(p.state.mass), seedOffset: p.state.seedOffset ? f32(p.state.seedOffset) : undefined, energy: p.state.energy ? f32(p.state.energy) : undefined, drive: p.state.drive ? f32(p.state.drive) : undefined, leakRgb: p.state.leakRgb ? f32(p.state.leakRgb) : undefined, lorenz: p.state.lorenz ? { x: f32(p.state.lorenz.x), y: f32(p.state.lorenz.y), z: f32(p.state.lorenz.z) } : undefined, rotation: p.state.rotation ? f32(p.state.rotation) : undefined });
  if (p.scent) g.setScent(Float32Array.from(p.scent.cells), p.scent.cols, p.scent.rows);
  const at = new Set(p.sampleAt || [p.steps]);
  const samples = {};
  for (let s = 1; s <= p.steps; s++) {
    g.step(p.params);
    if (at.has(s)) {
      const r = g.read();
      samples[s] = { x: Array.from(r.x), y: Array.from(r.y), vx: Array.from(r.vx), vy: Array.from(r.vy) };
      if (p.state.energy) {
        const d = g.readDrives();
        samples[s].dr = { energy: Array.from(d.energy), drive: Array.from(d.drive), leakRgb: Array.from(d.leakRgb) };
      }
      if (p.state.rotation) samples[s].rotation = Array.from(g.readDrives().rotation);
      if (p.state.lorenz) {
        const l = g.readLorenz();
        samples[s].lz = { x: Array.from(l.x), y: Array.from(l.y), z: Array.from(l.z) };
      }
    }
  }
  g.dispose();
  return { samples };
};
// window.__kcShadowRun({ n, steps, seed }) -> stats: the K3 wiring shadow over a real ParticleSystem (pre -> JS step -> post, per step).
window.__kcShadowRun = (p) => {
  const W = 1000;
  const H = 700;
  const assets = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
  const palette = { swatches: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'] };
  const lp = normalizeLayoutParams({ ...DEFAULT_LAYOUT_PARAMS, mode: 'swarm', behave: 'cruise', particleCount: p.n, ...(p.lp || {}) });
  const sys = new ParticleSystem();
  sys.init(p.n, W, H, assets, palette, p.seed);
  const host = createGpuSwarmHost(gl);
  // takeover: a pure-JS twin from the same seed, stepped beside the system the GPU's velocities drive
  let twin = null;
  let drift = 0;
  if (p.live) {
    twin = new ParticleSystem();
    twin.init(p.n, W, H, assets, palette, p.seed);
  }
  const T0 = 1_000_000;
  let toks = 0;
  for (let s = 0; s < p.steps; s++) {
    const t = T0 + s * (1000 / 60);
    const tok = host.pre('L', sys, lp, { attractor: null, canvasW: W, canvasH: H, loopTimeMs: t, seedOffsets: null, slowRender: false });
    if (tok) toks++;
    const gs = p.live ? host.velocities(tok, sys) : null;
    sys.update(gs ? { ...lp, gpuStep: gs } : lp, assets, palette, p.seed, t, null);
    if (twin) {
      twin.update(lp, assets, palette, p.seed, t, null);
      for (let i = 0; i < p.n; i++) drift = Math.max(drift, Math.abs(sys.x[i] - twin.x[i]), Math.abs(sys.y[i] - twin.y[i]));
    }
    host.post(tok, sys);
  }
  let speedMax = 0;
  let finite = true;
  for (let i = 0; i < p.n; i++) {
    if (![sys.x[i], sys.y[i], sys.vx[i], sys.vy[i]].every(Number.isFinite)) finite = false;
    speedMax = Math.max(speedMax, Math.hypot(sys.vx[i], sys.vy[i]));
  }
  const out = { ...host.stats, toks, drift, speedMax, finite };
  host.dispose();
  return out;
};
window.__kcReady = true;
</script>
</body>
</html>
