<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GL parity harness</title></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createRenderer, createLiveRenderer } from '../renderer.mjs';

const canvas = document.getElementById('c');
let renderer = null;

const b64ToU8 = (b64) => {
  // Atlas pixels arrive as an array of base64 pieces (glDriver.b64Pieces:
  // a whole-library atlas is past V8's single-string cap on this side
  // too) — decode piece by piece into one preallocated buffer, never
  // joined. A plain string still works.
  const pieces = Array.isArray(b64) ? b64 : [b64];
  const decodedLen = (p) => (p.length / 4) * 3 - (p.endsWith('==') ? 2 : p.endsWith('=') ? 1 : 0);
  const out = new Uint8Array(pieces.reduce((n, p) => n + decodedLen(p), 0));
  let off = 0;
  for (const p of pieces) {
    const bin = atob(p); // one piece at a time — never hold every decoded string at once
    for (let i = 0; i < bin.length; i++) out[off + i] = bin.charCodeAt(i);
    off += bin.length;
  }
  return out;
};
const u8ToB64 = (u8) => {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
};
// #1815 — the warmed field crosses with its packs base64'd
// (wetWarmup.wetExportPayload); decode them back to { n, rgba }
// Uint8Array packs for the renderer. Null stays null.
const decodeWet = (wet) => {
  if (!wet) return null;
  const pack = (p) => (p ? { n: p.n, rgba: b64ToU8(p.rgba) } : null);
  return {
    ...wet,
    wetVel: pack(wet.wetVel),
    wetMask: pack(wet.wetMask),
    pigDep: pack(wet.pigDep),
    display: wet.display ? { ...wet.display, mask: pack(wet.display.mask) } : null,
  };
};

/**
 * payload: { width, height, bg, contract, cells, atlasB64, atlasW, atlasH,
 *            atlasMips }
 * returns { pixelsB64, width, height } — pixels are top-first RGBA bytes.
 */
function renderArgs(payload) {
  const atlasPx = b64ToU8(payload.atlasB64);
  const atlasMips = (payload.atlasMips || []).map((m) => ({
    pixels: b64ToU8(m.b64), width: m.w, height: m.h,
  }));
  return {
    width: payload.width,
    height: payload.height,
    bg: payload.bg,
    wet: decodeWet(payload.wet), // #1815: warmed field for renderScene
    contract: payload.contract,
    cells: payload.cells,
    atlas: { pixels: atlasPx, width: payload.atlasW, height: payload.atlasH, mipmaps: atlasMips },
  };
}

/**
 * #present-orientation — what the VISIBLE canvas shows, against what the readback path returns for the same frame.
 * Returns both as top-first RGBA: `shown` is the default framebuffer read bottom-first and put back top-first (what a
 * viewer sees), `readback` is live.readback(). They must be the same picture.
 */
window.__kcPresentProbe = async (payload) => {
  const pc = document.createElement('canvas');
  document.body.appendChild(pc);
  const live = createLiveRenderer(pc);
  const a = renderArgs(payload);
  live.setAtlas(a.atlas.pixels, a.atlas.width, a.atlas.height, a.atlas.mipmaps);
  const target = live.renderFrame({ width: a.width, height: a.height, bg: a.bg, wet: a.wet, contract: a.contract, cells: a.cells }, { dprScale: 1 });
  const readback = live.readback(target, a.width, a.height);
  live.present(target);
  const gl = live.getGL();
  const w = pc.width; const h = pc.height;
  const bottomFirst = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bottomFirst);
  const shown = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) shown.set(bottomFirst.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
  return { shownB64: u8ToB64(shown), readbackB64: u8ToB64(readback), width: w, height: h };
};

/**
 * #1806 — payload.rawResolve renders in DATA space (raw premultiplied
 * clamp: no ACES, no dither) instead of presentation space. Pixel-math
 * proofs need it: the resolve's tonemap is nonlinear in alpha, so
 * byte-space folds of presentation renders cannot match. The ACCUM
 * input frame is data in production too (consumed as a 16F texture,
 * never resolved). The presentation defaults are always restored.
 */
function withResolve(payload, fn) {
  if (!renderer) renderer = createRenderer(canvas);
  if (!payload.rawResolve) return fn();
  renderer.setResolveOptions({ aces: 0, dither: 0 });
  try {
    return fn();
  } finally {
    renderer.setResolveOptions({});
  }
}

window.__kcRender = async (payload) => {
  if (!renderer) renderer = createRenderer(canvas);
  return withResolve(payload, () => {
    const { pixels, width, height } = renderer.renderScene(renderArgs(payload));
    return { pixelsB64: u8ToB64(pixels), width, height };
  });
};

/**
 * #1806 slice 1 — selective-accumulation seam. Payload is __kcRender's
 * plus { layerIds: [...] }: renders ONLY the named strata as an ACCUM
 * input frame (pre-FX light over transparent) via renderAccumInput.
 * Returns { pixelsB64, width, height } like __kcRender.
 */
window.__kcAccumInput = async (payload) => {
  if (!renderer) renderer = createRenderer(canvas);
  return withResolve(payload, () => {
    const { pixels, width, height } = renderer.renderAccumInput(renderArgs(payload), payload.layerIds || []);
    return { pixelsB64: u8ToB64(pixels), width, height };
  });
};

/**
 * ACCUM trail still (#190). payload:
 *   { width, height, bg, fade, optics, tunnel, prism, flow, echoes,
 *     audioFrames: [{ rms, flux, beat_phase, beatPulse } …] (per frame, optional),
 *     atlasB64, atlasW, atlasH, atlasMips, cells,
 *     frames: [{ contract }] }   // atlas shared across frames
 * Runs the whole sequence through the shared recipe (accum.mjs) and returns
 * the final buffer as top-first RGBA bytes.
 */
window.__kcAccum = async (payload) => {
  if (!renderer) renderer = createRenderer(canvas);
  const atlasPx = b64ToU8(payload.atlasB64);
  const atlasMips = (payload.atlasMips || []).map((m) => ({
    pixels: b64ToU8(m.b64), width: m.w, height: m.h,
  }));
  const atlas = { pixels: atlasPx, width: payload.atlasW, height: payload.atlasH, mipmaps: atlasMips };
  const frames = payload.frames.map((f) => ({
    width: payload.width,
    height: payload.height,
    bg: payload.bg,
    contract: f.contract,
    cells: payload.cells,
    atlas,
  }));
  const { pixels, width, height, age, stats } = renderer.renderAccumSequence(frames, {
    fade: payload.fade,
    optics: payload.optics,
    tunnel: payload.tunnel ?? 0,
    prism: payload.prism ?? 0,
    flow: payload.flow ?? 0,
    echoes: payload.echoes ?? 0,
    scan: payload.scan ?? 0, // #1804: slit-scan
    scanDirection: payload.scanDirection ?? 1,
    audio: payload.audioFrames || null,
    swell: payload.swell ?? 1, // #306: audio→glow fader
    background: payload.bg,
    palette: payload.palette ?? null, // #1803: halation tint derivation
    ageBuffer: payload.ageBuffer ?? false, // #1805: age buffer request
    dt: payload.dt ?? 1 / 60, // #1805: show-time seconds per step
    stats: payload.stats ?? false, // #1807: buffer statistics request
    wet: decodeWet(payload.wet), // #1815: warmed field, held across the sequence
  });
  return {
    pixelsB64: u8ToB64(pixels),
    width,
    height,
    // #1807: the final stamped statistics, when requested (plain object).
    ...(stats ? { stats } : {}),
    // #1805: the final age field as base64 of its Float32 bytes, when requested.
    ...(age ? { ageB64: u8ToB64(new Uint8Array(age.data.buffer, age.data.byteOffset, age.data.byteLength)) } : {}),
  };
};

/**
 * Export stills with chunked readback (#191). payload is the same shape as
 * __kcRender's, but pixels come back in 16MB base64 pieces: an 8K RGBA
 * readback is ~132MB (~177MB base64), past the ~100MB page.evaluate result
 * limit that motivated the chunked payload ferry in glDriver.mjs.
 *
 * __kcExportBegin(payload) -> { width, height, chunks }
 * __kcExportChunk(i)       -> { pixelsB64 }   // i in [0, chunks)
 * __kcExportEnd()          -> releases the stashed pixels
 */
let __kcExportPixels = null;
const __KC_EXPORT_PIECE = 16 * 1024 * 1024;
window.__kcExportBegin = async (payload) => {
  if (!renderer) renderer = createRenderer(canvas);
  const { pixels, width, height } = renderer.renderScene(renderArgs(payload));
  __kcExportPixels = pixels;
  return { width, height, chunks: Math.max(1, Math.ceil(pixels.length / __KC_EXPORT_PIECE)) };
};
window.__kcExportChunk = async (i) => {
  if (!__kcExportPixels) throw new Error('[export] no active export — call __kcExportBegin first');
  const s = __kcExportPixels.subarray(i * __KC_EXPORT_PIECE, (i + 1) * __KC_EXPORT_PIECE);
  return { pixelsB64: u8ToB64(s) };
};
window.__kcExportEnd = async () => {
  __kcExportPixels = null;
  return true;
};

/**
 * Perf probe (#189 acceptance: 3 stacked FX layers hold 60fps).
 * Uploads the atlas once, warms up, then times `iters` renderScene calls
 * (targets are allocated/freed per call, as in renderScene today). Includes
 * readPixels, so the number is an upper bound on a live loop's frame cost.
 */
window.__kcPerf = async (payload, iters) => {
  if (!renderer) renderer = createRenderer(canvas);
  const args = renderArgs(payload);
  renderer.renderScene(args); // warm up: compile programs, settle caches
  const times = [];
  for (let i = 0; i < iters; i++) {
    const t0 = performance.now();
    renderer.renderScene(args);
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  const avg = times.reduce((s, t) => s + t, 0) / times.length;
  return {
    iters, width: args.width, height: args.height,
    avgMs: avg, minMs: times[0], p50Ms: times[Math.floor(times.length / 2)],
    fps: 1000 / avg,
  };
};
window.__kcReady = true;
</script>
</body>
</html>
