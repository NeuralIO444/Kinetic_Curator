<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GPU culture kernel probe (K2 #2187)</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import { createGpuCulture } from '../cultureSim.mjs';
import { createGpuCultureHost } from '../gpuCultureHost.mjs';
// window.__kcCultureRun({ cols, rows, state, blocked, rule, gens, sampleEvery }) -> { final, samples: [{ gen, grid }] }
// Seeds the GPU culture, runs `gens` generations under `rule`; returns the final grid and (every `sampleEvery`) the grid.
const gl = document.getElementById('c').getContext('webgl2', { alpha: false, antialias: false });
window.__kcCultureRun = (p) => {
  const g = createGpuCulture(gl, p.cols, p.rows);
  g.seed(Uint8Array.from(p.state), p.blocked ? Uint8Array.from(p.blocked) : null);
  const samples = [];
  const every = p.sampleEvery || 0;
  let done = 0;
  while (done < p.gens) {
    const n = every ? Math.min(every, p.gens - done) : p.gens - done;
    g.step(n, p.rule);
    done += n;
    if (every) samples.push({ gen: done, grid: Array.from(g.read()) });
  }
  return { final: Array.from(g.read()), samples };
};
// window.__kcCultureBirthsRun({ cols, rows, state, blocked, rule, density (cols*rows floats), strength, seed, gens }) -> { samples: [grid per gen] }
// Each generation: in-shader fluid births from the density texture, then one step. The density texture is RG32F (G = density).
window.__kcCultureBirthsRun = (p) => {
  const g = createGpuCulture(gl, p.cols, p.rows);
  g.seed(Uint8Array.from(p.state), p.blocked ? Uint8Array.from(p.blocked) : null, 0);
  const rg = new Float32Array(p.cols * p.rows * 2);
  for (let i = 0; i < p.cols * p.rows; i++) rg[i * 2 + 1] = p.density[i];
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, p.cols, p.rows, 0, gl.RG, gl.FLOAT, rg);
  const samples = [];
  for (let k = 0; k < p.gens; k++) {
    g.births({ fluidTex: t, channel: 1, strength: p.strength, seed: p.seed });
    g.step(1, p.rule);
    samples.push(Array.from(g.read()));
  }
  return { samples };
};
// window.__kcCultureHostRun({ cols, rows, script: [{ stamp, seedState }], density, strength, seed }) -> { frames: [{ gen, grid }] }
// Drives createGpuCultureHost frame by frame; after each frame reads the host's grid SYNCHRONOUSLY (the async path is a
// timing question, not a correctness one). The density texture is RG32F (G = density).
window.__kcCultureHostRun = (p) => {
  const host = createGpuCultureHost(gl, p.cols, p.rows);
  const rg = new Float32Array(p.cols * p.rows * 2);
  for (let i = 0; i < p.cols * p.rows; i++) rg[i * 2 + 1] = p.density[i];
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, p.cols, p.rows, 0, gl.RG, gl.FLOAT, rg);
  const frames = [];
  for (const f of p.script) {
    const ss = { ...f.seedState, cells: Uint8Array.from(f.seedState.cells), blocked: Uint8Array.from(f.seedState.blocked) };
    host.frame({ stamp: f.stamp, seedState: ss, fluid: p.strength > 0 ? { tex: t, strength: p.strength, seed: p.seed } : null });
    const r = host.readSync();
    frames.push({ gen: r.gen, grid: Array.from(r.grid) });
  }
  host.dispose();
  return { frames };
};
// window.__kcCultureBirthsSeqRun({ cols, rows, state, blocked, rule, densities: [[per-gen density]...], strength, seed, gens }) -> { samples: [grid per gen] }
// K2 world slice: like __kcCultureBirthsRun, but the density is a SEQUENCE — one field per generation,
// re-uploaded before that generation's birth deal (the culture world's medium moves between generations).
window.__kcCultureBirthsSeqRun = (p) => {
  const g = createGpuCulture(gl, p.cols, p.rows);
  g.seed(Uint8Array.from(p.state), p.blocked ? Uint8Array.from(p.blocked) : null, 0);
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const samples = [];
  for (let k = 0; k < p.gens; k++) {
    const rg = new Float32Array(p.cols * p.rows * 2);
    const d = p.densities[k];
    for (let i = 0; i < p.cols * p.rows; i++) rg[i * 2 + 1] = d[i];
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, p.cols, p.rows, 0, gl.RG, gl.FLOAT, rg);
    g.births({ fluidTex: t, channel: 1, strength: p.strength, seed: p.seed });
    g.step(1, p.rule);
    samples.push(Array.from(g.read()));
  }
  gl.deleteTexture(t);
  return { samples };
};
window.__kcReady = true;
</script>
</body>
</html>
