<!doctype html>
<html>
<head><meta charset="utf-8"><title>KC GPU dish contacts probe (K3 slice 2a #2188)</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import { createGpuContacts } from '../dishContactsGpu.mjs';
import { createGpuContactResolve } from '../dishContactsResolveGpu.mjs';
// window.__kcContactsRun({ table: {nb,x,y,r,stratum,cgroup,umask,index}, slots, mode }) -> { contacts, overflow }
// mode 'sync' = detect(); 'async' = submit() then poll() until the fence signals.
const gl = document.getElementById('c').getContext('webgl2', { alpha: false, antialias: false });
window.__kcContactsRun = async (p) => {
  const t = p.table;
  const g = createGpuContacts(gl, Math.max(t.nb, 1), { slots: p.slots });
  let r;
  if (p.mode === 'async') {
    g.submit(t);
    for (let i = 0; i < 2000 && !(r = g.poll()); i++) await new Promise((res) => setTimeout(res, 2));
    if (!r) throw new Error('fence never signalled');
  } else {
    r = g.detect(t);
  }
  g.dispose();
  return r;
};
// window.__kcResolveRun({ table }) -> { dx, dy, dvx, dvy, count } (K3 slice 2b: the Jacobi resolution deltas)
window.__kcResolveRun = (p) => {
  const g = createGpuContactResolve(gl, Math.max(p.table.nb, 1));
  const r = g.resolve(p.table);
  g.dispose();
  return { dx: Array.from(r.dx), dy: Array.from(r.dy), dvx: Array.from(r.dvx), dvy: Array.from(r.dvy), count: Array.from(r.count) };
};
window.__kcReady = true;
</script>
</body>
</html>
