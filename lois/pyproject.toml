[project]
name = "lois"
version = "0.1.0"
description = "LOIS — terminal companion. Affective mirror of a KC-1 session. Side-quest #956."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
lois = "lois.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lois*"]
