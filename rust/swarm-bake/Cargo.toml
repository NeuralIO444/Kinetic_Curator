[package]
name = "swarm-bake"
version = "0.1.0"
edition = "2021"
description = "Swarm bake inner loop for Kinetic_Curator (#175) — compiled to wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pure-Rust math for sin/cos/atan2 on wasm (no system libm on
# wasm32-unknown-unknown). sqrt/floor/abs are compiler intrinsics and match
# JS Math.sqrt/Math.floor bit-for-bit; sin/cos/atan2 may differ from V8 in
# the last ulp — see the crate docs and swarmWasm.selfcheck.mjs.
libm = "0.2"

# Release profile lives in the workspace root (rust/Cargo.toml, #1317): in a
# workspace the root [profile.*] wins, so a per-crate copy would be silently
# ignored — the old one was moved, not changed.
